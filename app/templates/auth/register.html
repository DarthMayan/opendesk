{% extends "base.html" %}

{% block title %}Registro | OpenDesk{% endblock %}

{% block content %}
<section class="row justify-content-center">
    <div class="col-lg-7 col-xl-6">
        <div class="card od-card">
            <div class="card-body p-4 p-md-5">
                <p class="text-uppercase text-muted fw-semibold mb-2">Nueva cuenta</p>
                <h1 class="h2 fw-bold mb-3">Crea tu acceso a OpenDesk</h1>
                <p class="text-secondary mb-4">
                    Registra un usuario para empezar a interactuar con el sistema de tickets.
                </p>

                <form method="post" class="row g-3">
                    <div class="col-12">
                        <label for="name" class="form-label">Nombre</label>
                        <input id="name" name="name" type="text" class="form-control form-control-lg" placeholder="Tu nombre" required>
                    </div>
                    <div class="col-12">
                        <label for="email" class="form-label">Correo</label>
                        <input id="email" name="email" type="email" class="form-control form-control-lg" placeholder="tu@correo.com" required>
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label">Contrasena</label>
                        <input id="password" name="password" type="password" class="form-control form-control-lg" placeholder="Minimo 1 caracter" required>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label">Confirmar contrasena</label>
                        <input id="confirm_password" name="confirm_password" type="password" class="form-control form-control-lg" placeholder="Repite la contrasena" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-lg od-solid-btn">Crear cuenta</button>
                    </div>
                </form>

                <p class="text-secondary mt-4 mb-0">
                    Ya tienes cuenta?
                    <a href="{{ url_for('auth.login') }}" class="link-dark fw-semibold">Inicia sesion aqui</a>.
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
